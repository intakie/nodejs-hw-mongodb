type: object
required:
  - name
  - email
  - phoneNumber
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 652fd4c1a64c7a90c1234567
  name:
    description: "Contact's name"
    type: string
    example: John Doe
  email:
    description: "Contact's email"
    type: string
    example: john@example.com
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380971234567'
  contactType:
    description: "Contact's type"
    type: string
    enum: [work, home, personal]
    example: personal
  isFavourite:
    description: 'Favorite contact'
    type: boolean
    example: false
  userId:
    type: string
    description: 'Contact owner id'
    example: 68efd834f1781f960b1e7a6c
  photo:
    description: "Link to contact's photo"
    type: string
    example: 'https://res.cloudinary.com/yourcloud/image/upload/v123/photo.jpg'
  createdAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
  updatedAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
