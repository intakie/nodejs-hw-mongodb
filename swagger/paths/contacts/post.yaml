tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create contact
security:
  - bearerAuth: []

requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - phoneNumber
        properties:
          name:
            description: "Contact's name"
            type: string
            example: John Doe
          email:
            description: "Contact's email"
            type: string
            example: john@example.com
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380971234567'
          contactType:
            description: "Contact's type"
            type: string
            enum: [work, home, personal]
            example: personal
          isFavourite:
            description: 'Favorite contact'
            type: boolean
            example: false
          photo:
            type: string
            format: binary
            description: Contact photo
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    description: Unauthorized Error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unauthorized Error
  '500':
    description: Internal Server Error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: Internal Server Error
