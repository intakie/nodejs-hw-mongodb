tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update contact
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: John Doe
          email:
            type: string
            description: "Contact's email"
            example: john@example.com
          phoneNumber:
            type: string
            description: "Contact's phone number"
            example: '+380971234567'
          contactType:
            type: string
            description: "Contact's type"
            enum: [work, home, personal]
            example: personal
          isFavourite:
            type: boolean
            description: 'Favorite contact'
            example: false
          photo:
            type: string
            format: binary
            description: 'Updated contact photo'
responses:
  '200':
    description: Contact updated
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/contact.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
